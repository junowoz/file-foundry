name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check secure entitlements
        run: ./scripts/check_secure_entitlements.sh

      - name: Build release
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build_release.sh

      - name: Package DMG and checksums
        run: ./scripts/package_dmg.sh

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) found = 1 }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/FileFoundry.dmg \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
