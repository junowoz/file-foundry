<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- File Foundry: three rack units (the app's racks), the active one lit. macOS grid: 824 body, 100 inset. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E35"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E8ED"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- rack units -->
  <rect x="252" y="292" width="520" height="124" rx="40" fill="url(#unit)"/>
  <rect x="252" y="450" width="520" height="124" rx="40" fill="url(#unit)" fill-opacity="0.92"/>
  <rect x="252" y="608" width="520" height="124" rx="40" fill="url(#unit)" fill-opacity="0.84"/>

  <!-- lights: the top unit is active -->
  <circle cx="326" cy="354" r="24" fill="url(#ember)"/>
  <circle cx="326" cy="512" r="20" fill="#2B2E35" fill-opacity="0.22"/>
  <circle cx="326" cy="670" r="20" fill="#2B2E35" fill-opacity="0.22"/>

  <!-- vents -->
  <rect x="560" y="344" width="156" height="20" rx="10" fill="#2B2E35" fill-opacity="0.16"/>
  <rect x="560" y="502" width="156" height="20" rx="10" fill="#2B2E35" fill-opacity="0.16"/>
  <rect x="560" y="660" width="156" height="20" rx="10" fill="#2B2E35" fill-opacity="0.16"/>
</svg>
